services:
  - type: web
    name: peerdash-api
    env: node
    plan: free
    rootDir: apps/server
    buildCommand: npm install && npm run build
    startCommand: sh start.sh
    healthCheckPath: /health

    envVars:
      # Server
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 3001

      - key: API_BASE_URL
        sync: false # e.g. https://peerdash-api.onrender.com

      - key: CORS_ORIGIN
        sync: false # e.g. https://peerdash.vercel.app (comma-separated for multiple)

      # Auth
      - key: JWT_SECRET
        generateValue: true # auto-generated 32-byte random value

      - key: JWT_EXPIRY
        value: 15m

      - key: REFRESH_TOKEN_EXPIRY
        value: 7d

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # Logging
      - key: LOG_LEVEL
        value: info

      # Supabase/Postgres (required: set these in the Render dashboard)
      #
      # DATABASE_URL -> Transaction-pooler connection string.
      #                 Supabase Dashboard -> Settings -> Database ->
      #                 Connection string -> Transaction mode, port 6543.
      #                 Append: ?pgbouncer=true&connection_limit=1
      #
      # DIRECT_URL   -> Direct non-pooled connection string.
      #                 Same page -> Session mode, port 5432.
      #                 Used by prisma db push at startup.
      - key: DATABASE_URL
        sync: false

      - key: DIRECT_URL
        sync: false

      # Upstash Redis (optional: set in dashboard if you use Redis)
      - key: REDIS_URL
        sync: false # rediss://:password@host:port

      # Stripe (optional: set only if payments are enabled)
      - key: STRIPE_SECRET_KEY
        sync: false

      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      - key: STRIPE_PRO_PRICE_ID
        sync: false

      - key: STRIPE_ENTERPRISE_PRICE_ID
        sync: false
