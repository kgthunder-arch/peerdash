services:
  - type: web
    name: peerdash-api
    env: node
    plan: free
    rootDir: apps/server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: API_BASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRY
        value: 15m
      - key: REFRESH_TOKEN_EXPIRY
        value: 7d
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: peerdash-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: peerdash-redis
          type: redis
          property: connectionString

databases:
  - name: peerdash-db
    plan: free
    databaseName: peerdash
    user: peerdash

  - type: redis
    name: peerdash-redis
    plan: free
    ipAllowList: []
