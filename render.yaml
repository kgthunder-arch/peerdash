services:
  - type: web
    name: peerdash-api
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    rootDir: apps/server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: API_BASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRY
        value: 15m
      - key: REFRESH_TOKEN_EXPIRY
        value: 7d
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

  - type: pserv
    name: peerdash-db
    plan: free
    ipAllowList: []

  - type: redis
    name: peerdash-redis
    plan: free
    ipAllowList: []

