name: Deploy PeerDash

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 1. Build client & server to verify the code compiles ──────────────────
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install all workspace deps (includes devDeps needed for build)
      - name: Install root workspace deps
        run: npm install

      - name: Install client deps
        run: npm install
        working-directory: apps/client

      - name: Install server deps
        run: npm install
        working-directory: apps/server

      # Vite build also performs type-checking internally
      - name: Build client (Vite)
        run: npm run build
        working-directory: apps/client
        env:
          VITE_SIGNAL_SERVER_URL: ${{ secrets.VITE_SIGNAL_SERVER_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # Server: just generate prisma client and compile TS
      - name: Build server
        run: npx prisma generate && npx tsc --noEmit
        working-directory: apps/server
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

  # ── 2. Deploy frontend → Vercel ───────────────────────────────────────────
  deploy-vercel:
    name: Deploy → Vercel (frontend)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install client deps
        run: npm install
        working-directory: apps/client

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (production)
        id: vercel-deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✅ Deployed to $URL"

  # ── 3. Trigger Render redeploy (backend) ─────────────────────────────────
  deploy-render:
    name: Deploy → Render (backend)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Trigger Render deploy hook
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          if [[ "$STATUS" =~ ^2 ]]; then
            echo "✅ Render deploy triggered (HTTP $STATUS)"
          else
            echo "❌ Render deploy hook returned HTTP $STATUS"
            exit 1
          fi
